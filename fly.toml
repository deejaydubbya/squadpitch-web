app = "squadpitch-web"
primary_region = "ord"

[build]
  [build.args]
    # Autopilot Campaign Inbox UI — gates whether the inbox surface
    # renders + whether the read/dismiss/generate/approve hooks fire.
    # Backend Phase 2-5 routes are live (docs/AUTOPILOT_MVP_IMPLEMENTATION.md).
    NEXT_PUBLIC_AUTOPILOT_CAMPAIGN_INBOX_ENABLED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[env]
  NODE_ENV = "production"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
